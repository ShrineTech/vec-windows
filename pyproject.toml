[project]
name = "vec-windows"
version = "0.1.0"
requires-python = ">=3.9"
license = "MIT"
dependencies = []   # stdlib only; optional: anndata (to read .h5ad obs directly)

[project.optional-dependencies]
h5ad = ["anndata>=0.10"]

[project.scripts]
vec-windows = "vec_windows:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["vec_windows"]
